# =====================================================================
# Application Configuration - Personal Expense Tracker Backend
# =====================================================================
spring.application.name=expense-tracker-backend
server.port=${SERVER_PORT:8080}

# MySQL Database DataSource configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/expense_tracker?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration (HMAC-SHA256 hex/base64 key, 24 hours validity)
app.jwt.secret=${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173}

# Logging
logging.level.com.expensetracker=INFO
logging.level.org.springframework.security=INFO
